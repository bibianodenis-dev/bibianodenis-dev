<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;display=swap');
      
      .bg { fill: #0d1117; }
      .court-bg { fill: #121822; }
      .court-border { stroke: #334155; stroke-width: 2; fill: none; }
      .net-line { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 6; }
      .center-circle { stroke: #1e293b; stroke-width: 2; fill: none; }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace, Consolas, sans-serif;
      }
      
      .p1-paddle {
        fill: #38bdf8;
        filter: drop-shadow(0 0 8px #0ea5e9);
        animation: p1Motion 4.8s infinite ease-in-out;
      }
      
      .p2-paddle {
        fill: #c084fc;
        filter: drop-shadow(0 0 8px #9333ea);
        animation: p2Motion 4.8s infinite ease-in-out;
      }
      
      .ball-glow {
        fill: #ffffff;
        filter: drop-shadow(0 0 10px #38bdf8) drop-shadow(0 0 16px #0ea5e9);
        animation: ballMotion 4.8s infinite linear;
      }
      
      .ball-trail {
        fill: #0ea5e9;
        opacity: 0.4;
        animation: ballMotion 4.8s infinite linear;
      }
      
      .live-pulse {
        animation: pulse 1.6s infinite ease-in-out;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      
      @keyframes ballMotion {
        0%   { transform: translate(60px, 130px); }
        22%  { transform: translate(400px, 50px); }
        45%  { transform: translate(740px, 110px); }
        70%  { transform: translate(400px, 220px); }
        92%  { transform: translate(60px, 160px); }
        100% { transform: translate(60px, 130px); }
      }
      
      @keyframes p1Motion {
        0%   { transform: translateY(105px); }
        25%  { transform: translateY(65px); }
        50%  { transform: translateY(140px); }
        75%  { transform: translateY(90px); }
        92%  { transform: translateY(135px); }
        100% { transform: translateY(105px); }
      }
      
      @keyframes p2Motion {
        0%   { transform: translateY(120px); }
        25%  { transform: translateY(70px); }
        45%  { transform: translateY(85px); }
        70%  { transform: translateY(145px); }
        85%  { transform: translateY(110px); }
        100% { transform: translateY(120px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="10" class="bg" />

  <!-- Top HUD Bar -->
  <g class="font-mono">
    <!-- P1 Header -->
    <rect x="24" y="10" width="10" height="12" rx="2" fill="#38bdf8" />
    <text x="42" y="20" fill="#bae6fd" font-size="12" font-weight="700">DENIS ALVES [P1]</text>
    <text x="200" y="22" fill="#38bdf8" font-size="18" font-weight="800">07</text>

    <!-- Center Match Badge -->
    <rect x="290" y="8" width="220" height="20" rx="6" fill="#181e2a" stroke="#334155" stroke-width="1" />
    <circle cx="304" cy="18" r="4" fill="#10b981" class="live-pulse" />
    <text x="316" y="22" fill="#e2e8f0" font-size="11" font-weight="700">AUTONOMOUS PONG</text>
    <text x="445" y="22" fill="#34d399" font-size="10" font-weight="700">// LIVE AI</text>

    <!-- P2 Header -->
    <text x="560" y="22" fill="#c084fc" font-size="18" font-weight="800">05</text>
    <text x="595" y="20" fill="#f3e8ff" font-size="12" font-weight="700">AI BOT [P2]</text>
    <rect x="766" y="10" width="10" height="12" rx="2" fill="#c084fc" />
  </g>

  <!-- Court Arena -->
  <rect x="24" y="38" width="752" height="192" rx="6" class="court-bg" />
  <rect x="24" y="38" width="752" height="192" rx="6" class="court-border" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="24" y1="86" x2="776" y2="86" />
    <line x1="24" y1="134" x2="776" y2="134" />
    <line x1="24" y1="182" x2="776" y2="182" />
    <line x1="212" y1="38" x2="212" y2="230" />
    <line x1="588" y1="38" x2="588" y2="230" />
  </g>

  <!-- Center Circle and Net -->
  <circle cx="400" cy="134" r="36" class="center-circle" />
  <circle cx="400" cy="134" r="3" fill="#475569" />
  <line x1="400" y1="38" x2="400" y2="230" class="net-line" />

  <!-- Left Paddle (Denis Alves) -->
  <rect x="40" y="0" width="10" height="48" rx="5" class="p1-paddle" />

  <!-- Right Paddle (AI Opponent) -->
  <rect x="750" y="0" width="10" height="48" rx="5" class="p2-paddle" />

  <!-- Glowing Pong Ball & Trail -->
  <g>
    <circle r="7" class="ball-trail" />
    <circle r="5" class="ball-glow" />
  </g>
</svg>